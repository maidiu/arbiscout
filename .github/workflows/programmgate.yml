name: PROGRAMMA validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify work graph and source references
        run: python scripts/validate_programma.py
      - name: Verify generated question/task dashboards and CSV are current
        run: python scripts/render_programma.py --check
      - name: Install app test dependencies
        run: python -m pip install -r ENGINEERING/arbiscout_app/requirements.txt
      - name: Run end-to-end application source-free tests
        run: python -m unittest discover -s ENGINEERING/arbiscout_app/tests -v
      - name: Build complete fictional 20-to-10 dashboard
        run: python ENGINEERING/arbiscout_app/run_test.py --demo --as-of 2026-11-07 --output arbiscout_demo_20_to_10
      - name: Publish demo dashboard and intermediate JSON/CSV
        uses: actions/upload-artifact@v4
        with:
          name: arbiscout-demo-20-to-10
          path: arbiscout_demo_20_to_10/
          if-no-files-found: error
      - name: Run control-room unit tests
        run: python -m unittest discover -s tests -v
